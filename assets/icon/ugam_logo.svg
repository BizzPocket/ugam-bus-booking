<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9CC78"/>
      <stop offset="0.55" stop-color="#CBA24C"/>
      <stop offset="1" stop-color="#B8862F"/>
    </linearGradient>
  </defs>

  <!-- Cream ground (the canonical medallion ground; also the launcher bg) -->
  <rect width="1024" height="1024" fill="#FBF3EC"/>

  <!-- Calm, even rays of light — uniform length + spacing -->
  <g fill="#DDB85F">
    <polygon points="751.7,578.7 748.6,561.3 856.7,551.2"/>
    <polygon points="740.4,531.9 733.9,515.4 837.8,484.1"/>
    <polygon points="720.0,488.2 710.3,473.3 806.0,422.1"/>
    <polygon points="691.3,449.5 678.9,436.8 762.6,367.6"/>
    <polygon points="655.6,417.2 640.9,407.2 709.2,322.8"/>
    <polygon points="614.1,392.6 597.8,385.7 648.0,289.5"/>
    <polygon points="568.6,376.7 551.2,373.2 581.4,268.9"/>
    <polygon points="520.9,370.2 503.1,370.2 512.0,262.0"/>
    <polygon points="472.8,373.2 455.4,376.7 442.6,268.9"/>
    <polygon points="426.2,385.7 409.9,392.6 376.0,289.5"/>
    <polygon points="383.1,407.2 368.4,417.2 314.8,322.8"/>
    <polygon points="345.1,436.8 332.7,449.5 261.4,367.6"/>
    <polygon points="313.7,473.3 304.0,488.2 218.0,422.1"/>
    <polygon points="290.1,515.4 283.6,531.9 186.2,484.1"/>
    <polygon points="275.4,561.3 272.3,578.7 167.3,551.2"/>
  </g>

  <!-- Rising sun dome (gold gradient) with the cream word-mark -->
  <path d="M 280 612 A 232 232 0 0 1 744 612 Z" fill="url(#sun)"/>
  <text x="512" y="525" text-anchor="middle"
        font-family="Kohinoor Gujarati, Gujarati Sangam MN, GujaratiMT, Noto Sans Gujarati, sans-serif"
        font-weight="800" font-size="132" fill="#FBF3EC">ઉગમ</text>

  <!-- Yatra bus on the horizon — the sun rises BEHIND it (one integrated mark) -->
  <g>
    <rect x="248" y="560" width="528" height="140" rx="32" fill="#3A2415"/>
    <g fill="#FBF3EC">
      <rect x="282" y="586" width="82" height="54" rx="9"/>
      <rect x="376" y="586" width="82" height="54" rx="9"/>
      <rect x="470" y="586" width="82" height="54" rx="9"/>
      <rect x="564" y="586" width="82" height="54" rx="9"/>
      <rect x="658" y="586" width="84" height="54" rx="9"/>
    </g>
    <circle cx="760" cy="672" r="12" fill="#E9CC78"/>
    <g fill="#3A2415"><circle cx="352" cy="718" r="46"/><circle cx="672" cy="718" r="46"/></g>
    <g fill="#FBF3EC"><circle cx="352" cy="718" r="16"/><circle cx="672" cy="718" r="16"/></g>
  </g>
</svg>
