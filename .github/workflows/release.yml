name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to publish (e.g. v1.0.1). Created if missing.'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build & publish APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/ugam-bus-booking-${{ steps.tag.outputs.name }}.apk"

      - name: Write update manifest
        run: |
          VERSION="${{ steps.tag.outputs.name }}"
          VERSION_NUMERIC="${VERSION#v}"
          APK_URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}/ugam-bus-booking-${VERSION}.apk"
          cat > dist/latest.json <<EOF
          {
            "tag": "${VERSION}",
            "version": "${VERSION_NUMERIC}",
            "apk_url": "${APK_URL}",
            "released_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF
          cat dist/latest.json

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            dist/ugam-bus-booking-${{ steps.tag.outputs.name }}.apk
            dist/latest.json
